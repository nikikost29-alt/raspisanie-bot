# Конфиг для Vercel. app.py и так лежит в месте, где Vercel ищет точку входа,
# но указываем её явно — именно это предложила ошибка сборки
# "No python entrypoint found in default locations".
#
# Зависимости продублированы здесь намеренно: Vercel берёт их из
# pyproject.toml, requirements.txt или Pipfile, и какой файл выиграет —
# зависит от версии сборщика. Пусть список будет в обоих местах.
# lxml тут нет: parser.py при его отсутствии берёт встроенный html.parser,
# результат на живом сайте совпадает побайтово, а сборка не рискует упасть
# на компиляции колеса. python-dotenv нужен только локально, на Vercel
# переменные приходят из окружения.

[project]
name = "raspisanie-bot"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "tzdata>=2024.1",
]

[tool.vercel]
entrypoint = "app:app"
