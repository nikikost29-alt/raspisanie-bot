name: Расписание на завтра (ручной запуск)

# По расписанию рассылка теперь идёт из Vercel (crons в vercel.json):
# GitHub запускал её с опозданием на 5–8 часов, и расписание приходило
# в первом часу ночи. Здесь осталась только кнопка Run workflow — запасной
# вариант, если с Vercel что-то случится.
on:
  workflow_dispatch:

permissions:
  contents: write

# Не даём двум ручным запускам толкаться за state.json.
concurrency:
  group: schedule-state
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Поставить зависимости
        run: pip install -r requirements.txt

      - name: Отправить расписание
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          # --last только на последнем запуске за день; при ручном
          # workflow_dispatch github.event.schedule пустой, флага не будет
          LAST: ${{ github.event.schedule == '20 16 * * *' && '--last' || '' }}
        run: python bot.py $LAST

      - name: Сохранить state.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp state.json "$RUNNER_TEMP/state.mine.json"
          for i in 1 2 3 4 5; do
            git add state.json
            if git diff --cached --quiet; then
              echo "state.json не менялся, коммит не нужен"
              exit 0
            fi
            git commit -m "state: отправлено расписание [skip ci]"
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "state.json запушен с попытки $i"
              exit 0
            fi
            echo "push отклонён (кто-то запушил раньше), попытка $i: сливаю и повторяю"
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            python merge_state.py "$RUNNER_TEMP/state.mine.json" state.json state.json
            cp state.json "$RUNNER_TEMP/state.mine.json"
          done
          echo "не смог сохранить state.json за 5 попыток" >&2
          exit 1
