name: Команда /raspisanie

on:
  schedule:
    - cron: "*/5 * * * *"   # чаще пяти минут GitHub не разрешает
  workflow_dispatch:

permissions:
  contents: write

# Та же группа, что и у daily.yml: state.json пишут оба.
concurrency:
  group: schedule-state
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Поставить зависимости
        run: pip install -r requirements.txt

      - name: Разобрать команды
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
        run: python bot.py --poll

      - name: Сохранить state.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp state.json "$RUNNER_TEMP/state.mine.json"
          for i in 1 2 3 4 5; do
            git add state.json
            if git diff --cached --quiet; then
              echo "state.json не менялся, коммит не нужен"
              exit 0
            fi
            git commit -m "state: offset команд [skip ci]"
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "state.json запушен с попытки $i"
              exit 0
            fi
            echo "push отклонён (кто-то запушил раньше), попытка $i: сливаю и повторяю"
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            python merge_state.py "$RUNNER_TEMP/state.mine.json" state.json state.json
            cp state.json "$RUNNER_TEMP/state.mine.json"
          done
          echo "не смог сохранить state.json за 5 попыток" >&2
          exit 1
